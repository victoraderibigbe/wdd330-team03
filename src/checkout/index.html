<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <!--
      This header tag is left empty on purpose. The actual logo and cart
      icon HTML used to sit directly inside this tag, but now that content
      lives in one shared file (partials/header.html) so every page on the
      site shows the exact same header without repeating the code.
      The id="main-header" is how our JavaScript finds this exact spot on
      the page and fills it in automatically when the page loads.
    -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
    </main>

    <!--
      Same idea as the header above: this footer is intentionally empty,
      and gets filled in automatically using the shared footer file.
    -->
    <footer id="main-footer"></footer>
  </body>
</html>
